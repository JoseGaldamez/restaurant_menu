name: Build Main (Nightly)

# CAMBIO 1: El disparador ahora es un push a la rama 'main'
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "kivy[base]"
          pip install pyinstaller
          # pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller RestauranteMenu.spec

      - name: Zip the Build
        run: |
          powershell Compress-Archive -Path dist\RestauranteMenu\* -DestinationPath RestauranteMenu.zip

      # CAMBIO 2: Estrategia de "Rolling Release"
      # Esto actualizará siempre el mismo Release con el tag "nightly"
      - name: Update Nightly Release
        uses: softprops/action-gh-release@v1
        with:
          name: "Última Versión (Desarrollo)" # Título fijo
          tag_name: nightly # Tag fijo que se sobrescribirá
          files: RestauranteMenu.zip
          prerelease: true # Lo marca como "Pre-lanzamiento"
          overwrite: true # Importante: reemplaza el archivo anterior
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
